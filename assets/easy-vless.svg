<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Easy VLESS: how traffic flows</title>
  <desc id="desc">Devices on the LAN and the router itself are intercepted by nftables with TPROXY, passed to sing-box, and routing rules send each connection either directly to the internet or through a VLESS or Trojan server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C17"/>
      <stop offset="1" stop-color="#11152E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6D74A6"/>
    </marker>
  </defs>

  <rect width="1000" height="330" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="329" rx="19.5" fill="none" stroke="#262B4D"/>

  <text x="48" y="60" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="2">OPENWRT · LUCI · SING-BOX</text>
  <text x="46" y="112" fill="#F4F5FF" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700">Easy VLESS</text>
  <text x="48" y="146" fill="#9AA3C7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21">VLESS &amp; Trojan client for OpenWrt routers</text>
  <rect x="48" y="166" width="96" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="17" text-anchor="middle">
    <!-- pipeline -->
    <rect x="48" y="216" width="150" height="56" rx="10" fill="#141933" stroke="#2E3560"/>
    <text x="123" y="250" fill="#C9CFEA">LAN + router</text>

    <rect x="236" y="216" width="170" height="56" rx="10" fill="#141933" stroke="#2E3560"/>
    <text x="321" y="250" fill="#C9CFEA">nftables·TPROXY</text>

    <rect x="444" y="216" width="130" height="56" rx="10" fill="#1A1640" stroke="#8B5CF6"/>
    <text x="509" y="250" fill="#E9E3FF">sing-box</text>

    <rect x="612" y="216" width="140" height="56" rx="10" fill="#141933" stroke="#2E3560"/>
    <text x="682" y="250" fill="#C9CFEA">rules</text>

    <!-- outcomes -->
    <rect x="796" y="186" width="160" height="46" rx="10" fill="#141933" stroke="#2E3560"/>
    <text x="876" y="215" fill="#9AA3C7">direct</text>

    <rect x="796" y="256" width="160" height="46" rx="10" fill="#111C3A" stroke="#60A5FA"/>
    <text x="876" y="285" fill="#DCE8FF">VLESS/Trojan</text>
  </g>

  <g stroke="#6D74A6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M198 244 H232"/>
    <path d="M406 244 H440"/>
    <path d="M574 244 H608"/>
    <path d="M752 244 C774 244 774 209 792 209"/>
    <path d="M752 244 C774 244 774 279 792 279"/>
  </g>
</svg>
