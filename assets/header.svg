<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Quargelk</title>
  <desc id="desc">Turning ideas into working software. Linux, networking and embedded systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C17"/>
      <stop offset="1" stop-color="#11152E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="19.5" fill="none" stroke="#262B4D"/>

  <!-- Network motif: a router fanning out to a few nodes -->
  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55" fill="none">
    <path d="M960 140 L860 80"/>
    <path d="M960 140 L850 196"/>
    <path d="M960 140 L1060 72"/>
    <path d="M960 140 L1090 150"/>
    <path d="M960 140 L1030 222"/>
    <path d="M1060 72 L1090 150" stroke-opacity="0.25"/>
    <path d="M860 80 L850 196" stroke-opacity="0.25"/>
  </g>
  <g fill="#0E1226" stroke-width="2">
    <circle cx="860" cy="80" r="9" stroke="#A78BFA"/>
    <circle cx="850" cy="196" r="9" stroke="#8B5CF6"/>
    <circle cx="1060" cy="72" r="9" stroke="#60A5FA"/>
    <circle cx="1090" cy="150" r="9" stroke="#60A5FA"/>
    <circle cx="1030" cy="222" r="9" stroke="#818CF8"/>
    <circle cx="960" cy="140" r="22" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <circle cx="960" cy="140" r="7" fill="url(#accent)"/>

  <text x="72" y="92" fill="#7D86A8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20">$ whoami</text>
  <text x="70" y="156" fill="#F4F5FF" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="0.5">Quargelk</text>
  <text x="72" y="202" fill="url(#accent)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600">Turning ideas into working software</text>
  <text x="72" y="240" fill="#7D86A8" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18">linux · networking · embedded systems</text>
</svg>
